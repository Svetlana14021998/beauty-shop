server:
  port: 8082
  servlet:
    context-path: /beautyshop
spring:
  datasource:
    url: jdbc:h2:mem:beauty-shop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    clean-on-validation-error: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

app:
  service-photo-path: /images/procedures